# Parallel Streets — single source of truth for all stages.
# src/ modules read this; the Stage 10 notebook only overrides a few keys.

project:
  name: parallel-streets
  seed: 1337                     # rule: Stage 5 must reproduce from this seed

paths:
  schema:      schema.json
  raw:         data/raw          # info.csv and the downloaded tabular dumps
  interim:     data/interim      # filtered/joined tables
  images:      data/images       # resized imagery, one subdir per city
  checkpoints: checkpoints
  outputs:     outputs

data:
  hf_repo: NUS-UAL/global-streetscapes
  hf_repo_type: dataset
  prefer_parquet: true           # data/parquet/*.parquet loads far faster than csv
  # Only the tables Stage 1 actually needs to join.
  tables:
    - simplemaps
    - metadata_common_attributes
    - segmentation
    - osm
    - ghsl

# ---- Stage 1: subset -------------------------------------------------------
subset:
  # 20 cities, all six continents, chosen for distinct Koppen climate zones
  # so the encoder sees genuinely different streetscapes. Matched on city_id
  # (SimpleMaps 10-digit id) because city name strings are not unique globally.
  cities:
    - {city_id: 1702341327, name: "Singapore", country: "Singapore", continent: "Asia", koppen: "Af", img_count_full: 22579}
    - {city_id: 1158881289, name: "Taipei", country: "Taiwan", continent: "Asia", koppen: "Cfa", img_count_full: 198550}
    - {city_id: 1360771077, name: "Jakarta", country: "Indonesia", continent: "Asia", koppen: "Af", img_count_full: 115913}
    - {city_id: 1392685764, name: "Tokyo", country: "Japan", continent: "Asia", koppen: "Cfa", img_count_full: 65008}
    - {city_id: 1414102075, name: "Kuwait City", country: "Kuwait", continent: "Asia", koppen: "BWh", img_count_full: 63761}
    - {city_id: 1276451290, name: "Berlin", country: "Germany", continent: "Europe", koppen: "Cfb", img_count_full: 281033}
    - {city_id: 1643318494, name: "Moscow", country: "Russia", continent: "Europe", koppen: "Dfb", img_count_full: 198350}
    - {city_id: 1300715560, name: "Athens", country: "Greece", continent: "Europe", koppen: "Csa", img_count_full: 106003}
    - {city_id: 1620619017, name: "Lisbon", country: "Portugal", continent: "Europe", koppen: "Csa", img_count_full: 87461}
    - {city_id: 1840006060, name: "Washington", country: "United States", continent: "North America", koppen: "Cfa", img_count_full: 207103}
    - {city_id: 1840021543, name: "San Francisco", country: "United States", continent: "North America", koppen: "Csb", img_count_full: 68040}
    - {city_id: 1124399363, name: "Ottawa", country: "Canada", continent: "North America", koppen: "Dfb", img_count_full: 69074}
    - {city_id: 1188749877, name: "San Jose", country: "Costa Rica", continent: "North America", koppen: "Am", img_count_full: 68163}
    - {city_id: 1076532519, name: "Sao Paulo", country: "Brazil", continent: "South America", koppen: "Cfa", img_count_full: 275854}
    - {city_id: 1604728603, name: "Lima", country: "Peru", continent: "South America", koppen: "BWh", img_count_full: 118839}
    - {city_id: 1800406299, name: "Kampala", country: "Uganda", continent: "Africa", koppen: "Af", img_count_full: 31259}
    - {city_id: 1504175315, name: "Casablanca", country: "Morocco", continent: "Africa", koppen: "Csa", img_count_full: 19057}
    - {city_id: 1834843853, name: "Dar es Salaam", country: "Tanzania", continent: "Africa", koppen: "Aw", img_count_full: 30406}
    - {city_id: 1426977668, name: "Maseru", country: "Lesotho", continent: "Africa", koppen: "Cwb", img_count_full: 33803}
    - {city_id: 1036533631, name: "Melbourne", country: "Australia", continent: "Oceania", koppen: "Cfb", img_count_full: 91660}
  min_images_per_city: 2000      # acceptance criterion
  max_snap_dist_m: 20.0          # drop rows snapped >20 m from an OSM edge

# ---- Stage 2: imagery ------------------------------------------------------
imagery:
  images_per_city: 5000
  resize_px: 256                 # pre-resized on disk
  skip_existing: true            # idempotent

# ---- Stage 3: dataloader ---------------------------------------------------
dataloader:
  split_key: sequence_id         # rule 1 — NEVER random
  val_fraction: 0.2
  image_size: 224                # batches are (B, 3, 224, 224)
  batch_size: 64
  num_workers: 8

# ---- Stage 4: encoder ------------------------------------------------------
encoder:
  backbone: resnet50             # switch to a small ViT to compare later
  # backbone: vit_small_patch16_224
  pretrained: false              # the point of the project is that WE train it
  pretext_task: city_classification

# ---- Stage 5: train --------------------------------------------------------
train:
  epochs: 20
  lr: 0.001                      # from-scratch ResNet50 wants more than a fine-tuning LR
  weight_decay: 0.05
  label_smoothing: 0.1
  amp: true                      # mixed precision
  checkpoint_every_epoch: true

# ---- Stage 7: retrieval + evaluation ---------------------------------------
retrieval:
  top_k: 10
  n_queries: 20
  cross_city_only: true          # neighbours must be in OTHER cities
  systems:                       # all three answer the same query set
    - trained_embedding          # ours
    - tabular_features           # normalised, sklearn NearestNeighbors baseline
    - frozen_imagenet            # no training
  attributes:                    # physical attributes only — never perception
    - green_view_index
    - building_view_index        # derived: Building / Total, see schema.json
    - type_highway

# ---- Stage 10: notebook ----------------------------------------------------
notebook:
  train_from_scratch: false      # default False: load published checkpoint
  colab_reduced:                 # the True path must genuinely run on a T4
    epochs: 3
    batch_size: 32
    images_per_city: 500

# ============================================================================
# Stage 11 — city-invariant self-supervised representation learning
# Additive only. Nothing above this line is modified; Stages 0-10 keep their
# artifacts, checkpoints and outputs untouched.
# ============================================================================
stage11:
  out_dir: checkpoints/stage11       # never writes alongside runA/runB
  emb_dir: data/interim              # embeddings named emb_s11_<tag>.npz
  train_on: train_split              # SSL sees ONLY the 79,707 train rows

  ssl:
    method: vicreg                   # do not silently substitute another SSL method
    epochs: 100
    batch_size: 128                  # 12.05 GB peak measured on the 3080 Ti
    image_size: 224
    lr: 0.001
    weight_decay: 0.000001           # VICReg uses a very low wd
    warmup_epochs: 10
    amp: true
    num_workers: 8
    val_every: 5                     # VICReg loss on the val split, for monitoring
    log_every_steps: 25              # intra-epoch progress. Without it a merely
                                     # slow epoch looks identical to a stalled
                                     # one, which cost 30 blind minutes once.

  projector:
    # VICReg's paper uses 8192-wide on ImageNet-1k (1.28M images). At 100k
    # images 2048 is the appropriate scale, and measured only ~17% slower
    # at 8192 anyway - the backbone dominates.
    hidden_dim: 2048
    output_dim: 2048
    n_layers: 3

  vicreg:
    sim_coeff: 25.0                  # invariance
    std_coeff: 25.0                  # variance
    cov_coeff: 1.0                   # covariance
    eps: 0.0001

  augmentation:
    random_resized_crop: {scale_min: 0.3, scale_max: 1.0}
    horizontal_flip: 0.5
    color_jitter: {probability: 0.8, brightness: 0.4, contrast: 0.4,
                   saturation: 0.2, hue: 0.1}
    grayscale: 0.2
    gaussian_blur: {probability: 0.5, sigma_min: 0.1, sigma_max: 2.0}
    random_erasing: 0.25
    # Stage 9 found the encoder reading bottom-of-frame camera furniture.
    # OFF for Experiment A: masking it is Experiment C, tested separately so
    # the effect of SSL and the effect of masking stay distinguishable.
    bottom_mask:
      enabled: false
      probability: 0.5
      min_fraction: 0.10
      max_fraction: 0.20

  # Experiment B. Off for A.
  #
  # SCOPE DECISION (2026-09-03): the originally specified sweep was
  # lambda in {0, 0.05, 0.10, 0.25, 0.50}. Measured cost on the
  # power-capped GPU is ~50 h per run, so the sweep alone was ~200 h.
  # Reduced to a SINGLE contrast at lambda=0.10 against the lambda=0
  # run (Experiment A). Rationale in NOTES.md - this is a deliberate,
  # recorded reduction, not a silent one.
  adversarial:
    enabled: false
    lambda: 0.0
    hidden_dim: 512
    # planned single contrast; sweep values kept for the record
    planned_lambda: 0.10
    originally_specified_sweep: [0.0, 0.05, 0.10, 0.25, 0.50]

  # City linear probe - a DIAGNOSTIC, never a training objective.
  probe:
    epochs: 40
    lr: 0.01
    weight_decay: 0.0
    batch_size: 1024
